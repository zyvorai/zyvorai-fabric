<!doctype html>
<!-- Source for website/static/img/compare-social.png (1200x630).
     Render: see README.md in this folder. -->
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; background: #000; overflow: hidden; }
  body {
    position: relative;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    color: #f5f5f7;
    padding: 72px 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .glow {
    position: absolute; inset: -180px -120px auto; height: 560px;
    background:
      radial-gradient(50% 55% at 45% 40%, rgba(10,132,255,.42), transparent 70%),
      radial-gradient(30% 40% at 82% 30%, rgba(94,92,230,.30), transparent 70%);
    filter: blur(28px);
  }
  .eyebrow, h1, .row, .foot { position: relative; }
  .eyebrow { font-size: 22px; letter-spacing: .16em; text-transform: uppercase; color: #a1a1a6; }
  h1 { font-size: 92px; line-height: 1.02; letter-spacing: -.035em; font-weight: 650; margin-top: 22px; }
  h1 span {
    background: linear-gradient(100deg, #64d2ff 0%, #0a84ff 45%, #bf5af2 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .row { display: flex; gap: 14px; }
  .pill {
    font-size: 24px; padding: 10px 22px; border-radius: 980px;
    border: 1px solid #38383a; color: #f5f5f7;
  }
  .pill.hl { background: #0a84ff; border-color: #0a84ff; color: #fff; font-weight: 600; }
  .pill.dim { color: #a1a1a6; border-style: dashed; }
  .foot { display: flex; justify-content: space-between; font-size: 22px; color: #a1a1a6; }
</style>
<div class="glow"></div>
<div>
  <p class="eyebrow">Muse · Merion · Fabric · FluxVM</p>
  <h1>Muse proved the idea.<br /><span>You keep the keys.</span></h1>
</div>
<div class="row">
  <span class="pill dim">Muse</span>
  <span class="pill hl">Merion</span>
  <span class="pill">Fabric</span>
  <span class="pill">FluxVM</span>
</div>
<div class="foot"><span>Zyvor Fabric</span><span>zyvorai.github.io/fabric/#matrix</span></div>
