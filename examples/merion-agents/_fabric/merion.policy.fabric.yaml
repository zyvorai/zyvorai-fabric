# Shared Keep policy recipe for Fabric-facing packs.
# Sign before PUT in Keep mode (merion_sign_policy / merionctl policy set).
# Replace host with your fabricd hostname (must match egress_allow_hosts + credential host).
version: 1
default_egress: deny
allow:
  - host: "127.0.0.1"
    methods: [GET]
    action: fabric-read
    ask: never
  - host: "127.0.0.1"
    methods: [POST, PUT, DELETE]
    action: fabric-mutate
    ask: always
deny:
  - host: "*.onion"
taint:
  on_untrusted_page: block_egress_until_ask
