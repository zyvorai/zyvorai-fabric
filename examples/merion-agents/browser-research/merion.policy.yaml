version: 1
default_egress: deny
allow:
  - host: example.com
    methods: [GET]
    action: read
  - host: github.com
    methods: [GET]
    action: read
deny:
  - host: "*.onion"
taint:
  trusted_hosts: [example.com, github.com]
  on_untrusted_page: block_egress_until_ask
browser:
  enabled: true
  allow_hosts: [example.com, github.com]
  block_file_url: true
  max_tabs: 4
  snapshot_only: true
  downloads: deny
