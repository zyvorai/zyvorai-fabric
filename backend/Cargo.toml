[workspace]
resolver = "2"
members = [
    "enterprise-identity",
    "zyvor-fabricd",
    "fabricctl",
    "vm-model",
    "state-store",
    "vnc-proxy",
    "cloud-init",
    "tpm-support",
    "prometheus-exporter",
    "networking",
    "crates/storage",
    "crates/system",
    "crates/vm",
    "datacenter",
    "host-agent",
    "host-lifecycle",
    "resource-pools",
    "encryption",
    "predictive-drs",
    "distributed-storage",
    "fault-tolerance",
    "migration", # ZYVOR_RUNTIME_BOUNDARY_V1: compile/test migration orchestration in workspace CI
    "backup",
    "replication",

    "site-recovery",
    "content-library",
    "service-lb",
    "lifecycle-manager",
    "certificate-manager",
    "security",
    "crates/driver-core",
    "crates/fluxvm-client",
    "crates/fluxvm-driver",
    "crates/dnsmasq-manager",
    "crates/lock-manager",
    "crates/cgroup",
    "crates/api-error",
    "crates/input-guard",
    "crates/k8s-pod-client",
    "network-policy",
    "service-mesh",
    "traffic-shaping",
    "dns-policy",
    "vm-firewall",
    "vpn-mesh",
    "packet-mirror",
    "nat-gateway",
    "net-monitor",
    "ova-tools",
    "secrets-manager",
    "zyvor-fabric-sdk",
    "billing",
    "compliance",
    "openstack-compat",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
authors = ["zyvor-fabricd contributors"]

[workspace.dependencies]
tokio = { version = "1.53", features = ["full"] }
axum = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.6", features = ["derive", "color"] }
clap_complete = "4.5"
toml = "1.1"
futures = "0.3"
uuid = { version = "1.26", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.13"
tar = "0.4"
flate2 = "1.1"
hostname = "0.4"
rand = "0.10"
zbus = { version = "5", default-features = false, features = ["tokio"] }
async-stream = "0.3"
async-trait = "0.1"
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
sha2 = "0.11"
hex = "0.4"
time = "0.3"
totp-rs = { version = "6", features = ["gen_secret", "otpauth"] }
base32 = "0.5"
quick-xml = "0.42"

# `users` (pulled transitively via the `pam` crate, which hardcodes
# `users = "^0.10"`) is unmaintained and has two open advisories with no
# upstream fix. `uzers` is the actively maintained fork the advisories
# themselves recommend, but it never published a 0.10.x release, so it
# can't satisfy `^0.10` as a direct version-renamed patch. vendor/users-shim
# is a two-line local crate, versioned 0.10.0, that just re-exports uzers --
# see its own doc comment for details.
[patch.crates-io]
users = { path = "vendor/users-shim" }
