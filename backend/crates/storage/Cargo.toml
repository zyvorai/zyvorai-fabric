[package]
license = "LicenseRef-Zyvor-Production-2.0"
name = "zyvor-fabric-storage"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = { workspace = true }
input-guard = { path = "../input-guard" }
thiserror.workspace = true
tokio = { version = "1.54", features = ["full"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.29", features = ["v4", "serde"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.27"
