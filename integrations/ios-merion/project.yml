name: MerionPhone
options:
  bundleIdPrefix: dev.zyvor
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # No team and no signing identity here: this file builds for the simulator and for tests. Running on a device, and TestFlight, need your
    # own Apple developer team; set DEVELOPMENT_TEAM in Xcode. Nothing in this repository holds a signing secret.
    CODE_SIGN_STYLE: Automatic
packages:
  MerionKit:
    path: ../macos-merion
targets:
  MerionPhone:
    type: application
    platform: iOS
    sources:
      - path: Sources/MerionPhone
    dependencies:
      - package: MerionKit
        product: MerionKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zyvor.merion.phone
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Keep
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSFaceIDUsageDescription: "Approvals are signed with your face or fingerprint, on this device."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSHumanReadableCopyright: "Copyright 2026 Zyvor. Apache-2.0."
schemes:
  MerionPhone:
    build:
      targets:
        MerionPhone: all
