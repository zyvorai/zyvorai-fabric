name: Solvor
options:
  bundleIdPrefix: dev.zyvor
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"          # ad-hoc: runs on this Mac, not distributable
    ENABLE_HARDENED_RUNTIME: NO
packages:
  MerionKit:
    path: .
targets:
  Solvor:
    type: application
    platform: macOS
    sources:
      - path: Sources/Solvor
      - path: Resources/Assets.xcassets
    dependencies:
      - package: MerionKit
        product: MerionKit
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Solvor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleName: Solvor
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "Copyright 2026 Zyvor. Apache-2.0."
        NSUserNotificationsUsageDescription: "Keep tells you when a run finishes or needs your approval."
        NSFaceIDUsageDescription: "Approvals are signed with your fingerprint."
        NSMicrophoneUsageDescription: "Solvor listens when you press the microphone button, to hear a command."
        NSSpeechRecognitionUsageDescription: "Solvor turns what you say into text, on this Mac when your language allows it, to understand a command."
        NSAppleEventsUsageDescription: "Solvor reads the email you have open in your browser, only when you ask it to."
        CFBundleURLTypes:
          - CFBundleURLName: dev.zyvor.solvor
            CFBundleURLSchemes: [keep]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Any File
            LSItemContentTypes: [public.data]
            LSHandlerRank: Alternate
            CFBundleTypeRole: Viewer
        NSServices:
          - NSMenuItem:
              default: Send to Keep
            NSMessage: sendToMerion
            NSPortName: Solvor
            NSSendFileTypes: [public.data]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.zyvor.solvor
        PRODUCT_NAME: Solvor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  SolvorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SolvorTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.zyvor.solvor.tests
    dependencies:
      - target: Solvor
schemes:
  Solvor:
    build:
      targets:
        Solvor: all
    test:
      targets: [SolvorTests]
