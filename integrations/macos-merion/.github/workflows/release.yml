name: Release
# Builds a Solvor .dmg. With the Apple secrets set (docs/RELEASING.md) it is signed with a Developer ID, notarized and stapled; without them it builds an
# UNSIGNED dmg and publishes it as a pre-release marked unsigned. A tag v* creates the GitHub Release; a manual run only uploads the dmg as an artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-26
    env:
      HAVE_SIGNING: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && secrets.MACOS_CERT_PASSWORD != '' && secrets.MACOS_SIGN_IDENTITY != '' && secrets.APPSTORE_KEY_P8_BASE64 != '' && secrets.APPSTORE_KEY_ID != '' && secrets.APPSTORE_ISSUER_ID != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Unit tests
        run: swift test
      - name: Import the Developer ID certificate
        if: env.HAVE_SIGNING == 'true'
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/release.keychain-db"; KC_PASS="$(uuidgen)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Build, sign and notarize
        if: env.HAVE_SIGNING == 'true'
        env:
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_P8_BASE64: ${{ secrets.APPSTORE_KEY_P8_BASE64 }}
        run: |
          echo "$KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          NOTARY_KEY_PATH="$RUNNER_TEMP/notary.p8" tools/release.sh --sign --notarize
          rm -f "$RUNNER_TEMP/notary.p8"
      - name: Build (unsigned)
        if: env.HAVE_SIGNING != 'true'
        run: tools/release.sh
      - name: Check what Gatekeeper says
        if: env.HAVE_SIGNING == 'true'
        run: |
          DMG=$(ls build/Solvor-*.dmg | head -1)
          spctl -a -vv -t open --context context:primary-signature "$DMG"
      - uses: actions/upload-artifact@v4
        with:
          name: Solvor-${{ env.HAVE_SIGNING == 'true' && 'signed' || 'UNSIGNED' }}
          path: |
            build/Solvor-*.dmg
            build/Solvor-*.dmg.sha256
      - name: Publish the GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$HAVE_SIGNING" = "true" ]; then
            gh release create "$TAG" build/Solvor-*.dmg build/Solvor-*.dmg.sha256 --title "Solvor $TAG" --generate-notes
          else
            gh release create "$TAG" build/Solvor-*.dmg build/Solvor-*.dmg.sha256 --title "Solvor $TAG (unsigned)" --prerelease \
              --notes "UNSIGNED build: it runs only where Gatekeeper is told to allow it (right-click, Open). A signed and notarized release needs the Apple secrets described in docs/RELEASING.md."
          fi
