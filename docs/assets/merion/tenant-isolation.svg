<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="t d">
  <title id="t">Many users on one Keep shard</title>
  <desc id="d">Each user token reaches only that user's sessions, cells, cockpit, approvals, artifacts and audit rows. Another user's objects answer 404. Operator routes are closed to user tokens, quotas answer 429, and revoking one user leaves the rest untouched.</desc>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;fill:#1d1d1f}
    .h{font-size:16px;font-weight:650}
    .t{font-size:13px}
    .s{font-size:12px;fill:#6e6e73}
    .c{text-anchor:middle}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
  </style>
  <defs><marker id="x" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9z" fill="#0071e3"/></marker>
  <marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9z" fill="#d92d20"/></marker></defs>
  <rect x="1" y="1" width="1198" height="638" rx="24" fill="#fff" stroke="#e5e5ea" stroke-width="2"/>

  <rect x="40" y="120" width="220" height="120" rx="16" fill="#f5f5f7" stroke="#8e8e93" stroke-width="1.5"/>
  <text class="h" x="58" y="148">Ana's user token</text>
  <text class="m" x="58" y="172">user_id: ana</text>
  <text class="t" x="58" y="194">scopes: read, run, approve</text>
  <text class="s" x="58" y="216">Stateless, signed. 60 s to 7 days.</text>
  <line x1="260" y1="180" x2="346" y2="180" stroke="#0071e3" stroke-width="2" marker-end="url(#x)"/>
  <rect x="40" y="370" width="220" height="120" rx="16" fill="#f5f5f7" stroke="#8e8e93" stroke-width="1.5"/>
  <text class="h" x="58" y="398">Ben's user token</text>
  <text class="m" x="58" y="422">user_id: ben</text>
  <text class="t" x="58" y="444">scopes: read, run, approve</text>
  <text class="s" x="58" y="466">Stateless, signed. 60 s to 7 days.</text>
  <line x1="260" y1="430" x2="346" y2="430" stroke="#0071e3" stroke-width="2" marker-end="url(#x)"/>
  <rect x="350" y="40" width="530" height="530" rx="20" fill="#f4f9ff" stroke="#b7d5fb"/>
  <text class="h" x="372" y="72">One Keep shard</text>
  <rect x="372" y="96" width="486" height="176" rx="14" fill="#fff" stroke="#0071e3" stroke-width="1.5"/>
  <text class="h" x="392" y="126">Ana's data</text>
  <rect x="392" y="144" width="140" height="32" rx="16" fill="#eaf3ff" stroke="#b7d5fb"/><text class="t c" x="462" y="165">sessions</text>
  <rect x="544" y="144" width="140" height="32" rx="16" fill="#eaf3ff" stroke="#b7d5fb"/><text class="t c" x="614" y="165">cells</text>
  <rect x="696" y="144" width="140" height="32" rx="16" fill="#eaf3ff" stroke="#b7d5fb"/><text class="t c" x="766" y="165">cockpit</text>
  <rect x="392" y="188" width="140" height="32" rx="16" fill="#eaf3ff" stroke="#b7d5fb"/><text class="t c" x="462" y="209">approvals</text>
  <rect x="544" y="188" width="140" height="32" rx="16" fill="#eaf3ff" stroke="#b7d5fb"/><text class="t c" x="614" y="209">artifacts</text>
  <rect x="696" y="188" width="140" height="32" rx="16" fill="#eaf3ff" stroke="#b7d5fb"/><text class="t c" x="766" y="209">audit rows</text>
  <text class="s" x="392" y="248">A run started with this token carries that user id.</text>
  <rect x="372" y="346" width="486" height="176" rx="14" fill="#fff" stroke="#0071e3" stroke-width="1.5"/>
  <text class="h" x="392" y="376">Ben's data</text>
  <rect x="392" y="394" width="140" height="32" rx="16" fill="#eaf3ff" stroke="#b7d5fb"/><text class="t c" x="462" y="415">sessions</text>
  <rect x="544" y="394" width="140" height="32" rx="16" fill="#eaf3ff" stroke="#b7d5fb"/><text class="t c" x="614" y="415">cells</text>
  <rect x="696" y="394" width="140" height="32" rx="16" fill="#eaf3ff" stroke="#b7d5fb"/><text class="t c" x="766" y="415">cockpit</text>
  <rect x="392" y="438" width="140" height="32" rx="16" fill="#eaf3ff" stroke="#b7d5fb"/><text class="t c" x="462" y="459">approvals</text>
  <rect x="544" y="438" width="140" height="32" rx="16" fill="#eaf3ff" stroke="#b7d5fb"/><text class="t c" x="614" y="459">artifacts</text>
  <rect x="696" y="438" width="140" height="32" rx="16" fill="#eaf3ff" stroke="#b7d5fb"/><text class="t c" x="766" y="459">audit rows</text>
  <text class="s" x="392" y="498">A run started with this token carries that user id.</text>
  <text class="t" x="392" y="304">Ana asking for Ben's session, approval or artifact gets a <tspan style="font-weight:700;fill:#b42318">404</tspan>,</text>
  <text class="s" x="392" y="322">the same as an id that does not exist, so ids cannot be probed.</text>
  <line x1="790" y1="282" x2="790" y2="338" stroke="#d92d20" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#r)"/>
  <line x1="820" y1="282" x2="820" y2="338" stroke="#d92d20" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#r)"/>
  <line x1="850" y1="282" x2="850" y2="338" stroke="#d92d20" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#r)"/>
  <text class="t" x="372" y="556" style="font-size:12.5px">Quotas (off until you set them): runs per day, artifacts kept, model calls per day. Over the limit answers <tspan style="font-weight:650">429</tspan>.</text>
  <rect x="920" y="96" width="240" height="196" rx="16" fill="#f3efff" stroke="#7c5cd6" stroke-width="1.5"/>
  <text class="h" x="938" y="126">Operator token</text>
  <text class="s" x="938" y="146">Lives on the vendor gateway.</text>
  <text class="s" x="938" y="162">Never on a phone.</text>
  <text class="t" x="938" y="198">• Mints user tokens</text>
  <text class="t" x="938" y="220">• Enrols phone keys</text>
  <text class="t" x="938" y="242">• Reads every user's data</text>
  <text class="t" x="938" y="264">• Revokes a user's tokens</text>
  <line x1="880" y1="194" x2="916" y2="194" stroke="#7c5cd6" stroke-width="2" stroke-dasharray="5 5"/>
  <rect x="920" y="346" width="240" height="196" rx="16" fill="#fff5f5" stroke="#f0b4b4" stroke-width="1.5"/>
  <text class="h" x="938" y="376" style="fill:#b42318">A user token gets 403 on</text>
  <text class="t" x="938" y="404">• agents and policy</text>
  <text class="t" x="938" y="426">• the vault and model grants</text>
  <text class="t" x="938" y="448">• triggers and exports</text>
  <text class="t" x="938" y="470">• minting tokens</text>
  <text class="s" x="938" y="498">Anything new is closed to users</text>
  <text class="s" x="938" y="520">until someone lists it.</text>
  <rect x="40" y="590" width="1120" height="34" rx="12" fill="#fffaeb" stroke="#f5d78f"/>
  <text class="t" x="60" y="612"><tspan style="font-weight:650">Lost phone?</tspan> <tspan class="m" style="font-size:12px">POST /v1/users/ana/revoke-tokens</tspan> stops every token issued to Ana up to now. Ben is unaffected.</text>
</svg>