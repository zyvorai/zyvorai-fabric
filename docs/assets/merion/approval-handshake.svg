<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d">
  <title id="t">A phone-signed approval, step by step</title>
  <desc id="d">The agent asks to act; the shard opens an approval and pushes a signed message through the vendor's relay to the phone; the phone fetches what to sign, the person confirms with biometrics, the keystore signs, and the shard verifies the signature against the enrolled key before the action runs.</desc>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;fill:#1d1d1f}
    .h{font-size:14px;font-weight:650}
    .t{font-size:13px}
    .s{font-size:12px;fill:#6e6e73}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px}
    .c{text-anchor:middle}
    .life{stroke:#c7c7cc;stroke-width:1.5;stroke-dasharray:4 5}
    .arr{stroke:#0071e3;stroke-width:2;fill:none;marker-end:url(#a)}
    .ret{stroke:#6e6e73;stroke-width:1.6;fill:none;stroke-dasharray:6 5;marker-end:url(#g)}
    .note{fill:#fff;stroke:#b7d5fb;stroke-width:1.5}
    .n{font-weight:700;fill:#0058b8}
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9z" fill="#0071e3"/></marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9z" fill="#6e6e73"/></marker>
  </defs>
  <rect x="1" y="1" width="1198" height="798" rx="24" fill="#fff" stroke="#e5e5ea" stroke-width="2"/>

  <line class="life" x1="120" y1="66" x2="120" y2="700"/>
  <rect x="40" y="22" width="160" height="42" rx="12" fill="#f5f5f7" stroke="#8e8e93" stroke-width="1.5"/><text class="h c" x="120" y="48">Agent cell</text>
  <line class="life" x1="370" y1="66" x2="370" y2="700"/>
  <rect x="290" y="22" width="160" height="42" rx="12" fill="#eaf3ff" stroke="#0071e3" stroke-width="1.5"/><text class="h c" x="370" y="48">Keep shard</text>
  <line class="life" x1="620" y1="66" x2="620" y2="700"/>
  <rect x="540" y="22" width="160" height="42" rx="12" fill="#f3efff" stroke="#7c5cd6" stroke-width="1.5"/><text class="h c" x="620" y="48">Vendor push relay</text>
  <line class="life" x1="870" y1="66" x2="870" y2="700"/>
  <rect x="790" y="22" width="160" height="42" rx="12" fill="#f5f5f7" stroke="#8e8e93" stroke-width="1.5"/><text class="h c" x="870" y="48">User's phone</text>
  <line class="arr" x1="120" y1="112" x2="370" y2="112"/>
  <text class="t c" x="245.0" y="104"><tspan class="n">1</tspan>  asks to send an email</text>
  <rect class="note" x="265" y="130" width="210" height="67" rx="10"/>
  <text class="t" x="277" y="152"><tspan class="n">2</tspan>  Policy says: ask a person.</text>
  <text class="t" x="277" y="169">Opens an approval with a</text>
  <text class="t" x="277" y="186">challenge and an expiry.</text>
  <line class="arr" x1="370" y1="232" x2="620" y2="232"/>
  <text class="t c" x="495.0" y="224"><tspan class="n">3</tspan>  signed message</text>
  <text class="s c" x="495.0" y="250">approval.requested, HMAC-signed</text>
  <line class="arr" x1="620" y1="300" x2="870" y2="300"/>
  <text class="t c" x="745.0" y="292"><tspan class="n">4</tspan>  push, on the vendor's channel</text>
  <line class="arr" x1="870" y1="352" x2="370" y2="352"/>
  <text class="t c" x="620.0" y="344"><tspan class="n">5</tspan>  GET /v1/inbox</text>
  <line class="ret" x1="370" y1="388" x2="870" y2="388"/>
  <text class="t c" x="620.0" y="380"><tspan class="n"></tspan>  what to sign</text>
  <rect class="note" x="775" y="410" width="190" height="67" rx="10"/>
  <text class="t" x="787" y="432"><tspan class="n">6</tspan>  The person reads it,</text>
  <text class="t" x="787" y="449">confirms with biometrics.</text>
  <text class="t" x="787" y="466">The keystore signs it.</text>
  <line class="arr" x1="870" y1="520" x2="370" y2="520"/>
  <text class="t c" x="620.0" y="512"><tspan class="n">7</tspan>  POST /v1/approvals/{id}</text>
  <text class="s c" x="620.0" y="538">decision, device_id, signature</text>
  <rect class="note" x="265" y="566" width="210" height="84" rx="10"/>
  <text class="t" x="277" y="588"><tspan class="n">8</tspan>  Verify against the enrolled</text>
  <text class="t" x="277" y="605">key: signature, challenge,</text>
  <text class="t" x="277" y="622">expiry, action digest.</text>
  <text class="t" x="277" y="639">Write it to the audit journal.</text>
  <line class="ret" x1="370" y1="690" x2="120" y2="690"/>
  <text class="t c" x="245.0" y="682"><tspan class="n">9</tspan>  approved: the action runs</text>
  <rect x="985" y="330" width="195" height="182" rx="12" fill="#f5f5f7" stroke="#d2d2d7"/>
  <text class="h" x="999" y="354" style="font-size:12.5px">The text the phone signs</text>
  <text class="m" x="999" y="376">keep-approval-v1</text>
  <text class="m" x="999" y="392">approval: &lt;id&gt;</text>
  <text class="m" x="999" y="408">decision: approved</text>
  <text class="m" x="999" y="424">kind: &lt;kind&gt;</text>
  <text class="m" x="999" y="440">subject: &lt;subject&gt;</text>
  <text class="m" x="999" y="456">action-sha256: &lt;hash&gt;</text>
  <text class="m" x="999" y="472">challenge: &lt;hash&gt;</text>
  <text class="m" x="999" y="488">expires: &lt;time&gt;</text>
  <rect x="40" y="708" width="1120" height="70" rx="14" fill="#fff5f5" stroke="#f0b4b4"/>
  <text class="h" x="60" y="734" style="fill:#b42318">Refused with 403, and the approval stays pending, if:</text>
  <rect x="60" y="744" width="150" height="24" rx="12" fill="#fff" stroke="#f0b4b4"/><text class="s c" x="135.0" y="760" style="fill:#7a271a">an unknown device</text>
  <rect x="222" y="744" width="250" height="24" rx="12" fill="#fff" stroke="#f0b4b4"/><text class="s c" x="347.0" y="760" style="fill:#7a271a">a signature for the other decision</text>
  <rect x="484" y="744" width="255" height="24" rx="12" fill="#fff" stroke="#f0b4b4"/><text class="s c" x="611.5" y="760" style="fill:#7a271a">a signature for a different approval</text>
  <rect x="751" y="744" width="135" height="24" rx="12" fill="#fff" stroke="#f0b4b4"/><text class="s c" x="818.5" y="760" style="fill:#7a271a">a changed action</text>
  <rect x="898" y="744" width="175" height="24" rx="12" fill="#fff" stroke="#f0b4b4"/><text class="s c" x="985.5" y="760" style="fill:#7a271a">the window has passed</text>
</svg>