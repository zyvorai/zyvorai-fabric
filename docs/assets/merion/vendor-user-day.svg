<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="t d">
  <title id="t">A user's day with a vendor agent</title>
  <desc id="d">Five steps: sign up, enrol the phone, ask, approve on the phone, see what happened.</desc>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;fill:#1d1d1f}
    .h{font-size:16px;font-weight:650}
    .t{font-size:13px}
    .s{font-size:12px;fill:#6e6e73}
    .c{text-anchor:middle}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
  </style>
  <defs><marker id="x" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9z" fill="#0071e3"/></marker></defs>
  <rect x="1" y="1" width="1198" height="328" rx="24" fill="#fff" stroke="#e5e5ea" stroke-width="2"/>

  <rect x="31" y="40" width="210" height="250" rx="18" fill="#fff" stroke="#d2d2d7" stroke-width="1.5"/>
  <circle cx="61" cy="72" r="15" fill="#0071e3"/><text class="t c" x="61" y="77" style="fill:#fff;font-weight:700">1</text>
  <text class="h" x="85" y="78" style="font-size:15px">Sign up</text>
  <text class="t" x="49" y="116">The vendor app logs the</text>
  <text class="t" x="49" y="136">user in. The gateway</text>
  <text class="t" x="49" y="156">picks a shard in their</text>
  <text class="t" x="49" y="176">region, once.</text>
  <rect x="49" y="252" width="68" height="24" rx="12" fill="#f3efff" stroke="#7c5cd6"/><text class="s" x="61" y="268" style="fill:#7c5cd6;font-weight:650">Vendor</text>
  <line x1="243" y1="165" x2="261" y2="165" stroke="#0071e3" stroke-width="2" marker-end="url(#x)"/>
  <rect x="263" y="40" width="210" height="250" rx="18" fill="#fff" stroke="#d2d2d7" stroke-width="1.5"/>
  <circle cx="293" cy="72" r="15" fill="#0071e3"/><text class="t c" x="293" y="77" style="fill:#fff;font-weight:700">2</text>
  <text class="h" x="317" y="78" style="font-size:15px">Enrol the phone</text>
  <text class="t" x="281" y="116">After a strong login the</text>
  <text class="t" x="281" y="136">phone makes a key in its</text>
  <text class="t" x="281" y="156">keystore. The gateway</text>
  <text class="t" x="281" y="176">enrols the public key.</text>
  <rect x="281" y="252" width="128" height="24" rx="12" fill="#f3efff" stroke="#7c5cd6"/><text class="s" x="293" y="268" style="fill:#7c5cd6;font-weight:650">Phone + vendor</text>
  <line x1="475" y1="165" x2="493" y2="165" stroke="#0071e3" stroke-width="2" marker-end="url(#x)"/>
  <rect x="495" y="40" width="210" height="250" rx="18" fill="#fff" stroke="#d2d2d7" stroke-width="1.5"/>
  <circle cx="525" cy="72" r="15" fill="#0071e3"/><text class="t c" x="525" y="77" style="fill:#fff;font-weight:700">3</text>
  <text class="h" x="549" y="78" style="font-size:15px">Ask</text>
  <text class="t" x="513" y="116">The gateway calls the</text>
  <text class="t" x="513" y="136">user's shard with a</text>
  <text class="t" x="513" y="156">short-lived token. The</text>
  <text class="t" x="513" y="176">agent works in a sealed</text>
  <text class="t" x="513" y="196">cell.</text>
  <rect x="513" y="252" width="54" height="24" rx="12" fill="#eaf3ff" stroke="#0071e3"/><text class="s" x="525" y="268" style="fill:#0071e3;font-weight:650">Keep</text>
  <line x1="707" y1="165" x2="725" y2="165" stroke="#0071e3" stroke-width="2" marker-end="url(#x)"/>
  <rect x="727" y="40" width="210" height="250" rx="18" fill="#fff" stroke="#d2d2d7" stroke-width="1.5"/>
  <circle cx="757" cy="72" r="15" fill="#0071e3"/><text class="t c" x="757" y="77" style="fill:#fff;font-weight:700">4</text>
  <text class="h" x="781" y="78" style="font-size:15px">Approve</text>
  <text class="t" x="745" y="116">Before it sends, buys or</text>
  <text class="t" x="745" y="136">deletes, the phone gets a</text>
  <text class="t" x="745" y="156">push. The person confirms</text>
  <text class="t" x="745" y="176">and the phone signs.</text>
  <rect x="745" y="252" width="61" height="24" rx="12" fill="#f5f5f7" stroke="#6e6e73"/><text class="s" x="757" y="268" style="fill:#6e6e73;font-weight:650">Phone</text>
  <line x1="939" y1="165" x2="957" y2="165" stroke="#0071e3" stroke-width="2" marker-end="url(#x)"/>
  <rect x="959" y="40" width="210" height="250" rx="18" fill="#fff" stroke="#d2d2d7" stroke-width="1.5"/>
  <circle cx="989" cy="72" r="15" fill="#0071e3"/><text class="t c" x="989" y="77" style="fill:#fff;font-weight:700">5</text>
  <text class="h" x="1013" y="78" style="font-size:15px">See what happened</text>
  <text class="t" x="977" y="116">Runs, artifacts and the</text>
  <text class="t" x="977" y="136">audit trail come back the</text>
  <text class="t" x="977" y="156">same way.</text>
  <rect x="977" y="252" width="54" height="24" rx="12" fill="#eaf3ff" stroke="#0071e3"/><text class="s" x="989" y="268" style="fill:#0071e3;font-weight:650">Keep</text>
  <text class="s c" x="600" y="316">Tags show who does the step. The vendor builds the app and the gateway; Keep supplies the cell, policy, approvals and audit.</text>
</svg>