<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="t d">
  <title id="t">The Keep cockpit</title>
  <desc id="d">A Keep session brieffing a PDF: the sealed cell is up, extraction is done, the brief is ready, and outbound connections read zero. Approvals wait for you, and the agent sees page structure while you see pixels.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="80%">
      <stop offset="0" stop-color="#6ee7b7" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6ee7b7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151d29"/>
      <stop offset="1" stop-color="#0f151e"/>
    </linearGradient>
    <linearGradient id="pix" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22324a"/>
      <stop offset="1" stop-color="#1a2330"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Helvetica,Arial,sans-serif}
    .mono{font-family:'SF Mono','JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
  </style>

  <rect width="1000" height="600" fill="#0a0e14"/>
  <rect width="1000" height="600" fill="url(#glow)"/>

  <g filter="url(#shadow)">
    <rect x="60" y="48" width="880" height="504" rx="18" fill="url(#win)" stroke="#2a3648" stroke-width="1"/>
  </g>

  <!-- window chrome -->
  <circle cx="92" cy="80" r="6" fill="#3a475b"/><circle cx="114" cy="80" r="6" fill="#3a475b"/><circle cx="136" cy="80" r="6" fill="#3a475b"/>
  <text x="500" y="85" text-anchor="middle" class="sans" font-size="13" fill="#8b9bb0">Keep · vendor-sow.pdf</text>
  <line x1="60" y1="108" x2="940" y2="108" stroke="#2a3648"/>

  <!-- left: goal + steps -->
  <text x="96" y="146" class="mono" font-size="11" letter-spacing="1.6" fill="#8b9bb0">GOAL</text>
  <text x="96" y="176" class="sans" font-size="22" font-weight="600" fill="#e8eef5">Brief this PDF</text>
  <text x="96" y="200" class="sans" font-size="14" fill="#8b9bb0">One page, saved to your workspace.</text>

  <g class="sans" font-size="13" font-weight="500">
    <rect x="96" y="226" width="92" height="30" rx="15" fill="#6ee7b7" fill-opacity="0.12" stroke="#6ee7b7" stroke-opacity="0.5"/>
    <text x="142" y="246" text-anchor="middle" fill="#6ee7b7">✓ Cell up</text>
    <rect x="198" y="226" width="86" height="30" rx="15" fill="#6ee7b7" fill-opacity="0.12" stroke="#6ee7b7" stroke-opacity="0.5"/>
    <text x="241" y="246" text-anchor="middle" fill="#6ee7b7">✓ Extract</text>
    <rect x="294" y="226" width="110" height="30" rx="15" fill="#6ee7b7" fill-opacity="0.12" stroke="#6ee7b7" stroke-opacity="0.5"/>
    <text x="349" y="246" text-anchor="middle" fill="#6ee7b7">✓ Brief ready</text>
  </g>

  <!-- proof card -->
  <rect x="96" y="286" width="308" height="132" rx="14" fill="#0c1118" stroke="#2a3648"/>
  <text x="118" y="314" class="mono" font-size="11" letter-spacing="1.6" fill="#8b9bb0">EGRESS PROOF</text>
  <text x="118" y="378" class="sans" font-size="64" font-weight="700" fill="#6ee7b7" letter-spacing="-2">0</text>
  <text x="168" y="372" class="sans" font-size="15" fill="#e8eef5">outbound connections</text>
  <text x="118" y="402" class="sans" font-size="12" fill="#8b9bb0">Counted from the audit journal. Enforced on the host.</text>

  <!-- honesty badge -->
  <rect x="96" y="440" width="196" height="30" rx="15" fill="#1a2330" stroke="#2a3648"/>
  <circle cx="116" cy="455" r="4" fill="#8b9bb0"/>
  <text x="128" y="459" class="mono" font-size="12" fill="#c5d0de">evidence: software-test</text>

  <!-- divider -->
  <line x1="440" y1="132" x2="440" y2="524" stroke="#2a3648"/>

  <!-- right top: split-sight -->
  <text x="476" y="146" class="mono" font-size="11" letter-spacing="1.6" fill="#8b9bb0">SPLIT-SIGHT</text>

  <rect x="476" y="162" width="200" height="176" rx="12" fill="#0c1118" stroke="#2a3648"/>
  <text x="492" y="186" class="mono" font-size="10" letter-spacing="1.4" fill="#6ee7b7">AGENT SEES</text>
  <g class="mono" font-size="11.5" fill="#c5d0de">
    <text x="492" y="216">heading "Vendor SOW"</text>
    <text x="492" y="240" fill="#8b9bb0">  @e1 button "Download PDF"</text>
    <text x="492" y="264" fill="#8b9bb0">  @e2 textbox "Notes"</text>
  </g>
  <text x="492" y="318" class="sans" font-size="12" fill="#8b9bb0">Structure only.</text>

  <rect x="692" y="162" width="216" height="176" rx="12" fill="url(#pix)" stroke="#2a3648"/>
  <text x="708" y="186" class="mono" font-size="10" letter-spacing="1.4" fill="#e8eef5">YOU SEE</text>
  <rect x="708" y="200" width="184" height="10" rx="5" fill="#e8eef5" fill-opacity="0.22"/>
  <rect x="708" y="222" width="140" height="8" rx="4" fill="#e8eef5" fill-opacity="0.14"/>
  <rect x="708" y="240" width="160" height="8" rx="4" fill="#e8eef5" fill-opacity="0.14"/>
  <rect x="708" y="266" width="86" height="26" rx="13" fill="#0071e3" fill-opacity="0.9"/>
  <text x="751" y="283" text-anchor="middle" class="sans" font-size="11" font-weight="600" fill="#fff">Download PDF</text>
  <text x="708" y="318" class="sans" font-size="12" fill="#c5d0de">Real pixels, live.</text>

  <!-- right bottom: approval -->
  <text x="476" y="376" class="mono" font-size="11" letter-spacing="1.6" fill="#8b9bb0">WAITING FOR YOU</text>
  <rect x="476" y="392" width="432" height="112" rx="14" fill="#0c1118" stroke="#2a3648"/>
  <text x="500" y="424" class="sans" font-size="16" font-weight="600" fill="#e8eef5">Send the brief by email?</text>
  <text x="500" y="448" class="sans" font-size="13" fill="#8b9bb0">The agent asked. Nothing leaves until you approve.</text>
  <rect x="500" y="462" width="96" height="30" rx="15" fill="#6ee7b7"/>
  <text x="548" y="482" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#0a0e14">Approve</text>
  <rect x="608" y="462" width="80" height="30" rx="15" fill="none" stroke="#3a475b"/>
  <text x="648" y="482" text-anchor="middle" class="sans" font-size="13" fill="#c5d0de">Deny</text>
</svg>
