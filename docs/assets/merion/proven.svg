    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cc4ff"/><stop offset="1" stop-color="#4f7cff"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b79bff"/><stop offset="1" stop-color="#8a5cf6"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffa0c0"/><stop offset="1" stop-color="#ff6b9a"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7ef0c0"/><stop offset="1" stop-color="#1fc98a"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.025"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="800" y="130" font-size="20" font-weight="600" letter-spacing="8" fill="#86868b" text-anchor="middle">CHECKED, NOT CLAIMED</text>
    <text x="800" y="230" font-size="84" font-weight="700" letter-spacing="-2.5" fill="#f5f5f7" text-anchor="middle">Proven, not promised.</text>
    <g transform="translate(110 310)"><rect width="320" height="340" rx="36" fill="url(#tile)" stroke="url(#rim)" stroke-width="1.5"/><text x="36" y="190" font-size="130" font-weight="700" letter-spacing="-5" fill="url(#g1)">533</text><text x="36" y="262" font-size="26" font-weight="600" fill="#f5f5f7">runtime tests</text><text x="36" y="298" font-size="20" fill="#86868b">all pass</text></g>
    <g transform="translate(450 310)"><rect width="320" height="340" rx="36" fill="url(#tile)" stroke="url(#rim)" stroke-width="1.5"/><text x="36" y="190" font-size="130" font-weight="700" letter-spacing="-5" fill="url(#g2)">82</text><text x="36" y="262" font-size="26" font-weight="600" fill="#f5f5f7">end-to-end checks</text><text x="36" y="298" font-size="20" fill="#86868b">82 of 82 pass</text></g>
    <g transform="translate(790 310)"><rect width="320" height="340" rx="36" fill="url(#tile)" stroke="url(#rim)" stroke-width="1.5"/><text x="36" y="190" font-size="130" font-weight="700" letter-spacing="-5" fill="url(#g3)">14</text><text x="36" y="262" font-size="26" font-weight="600" fill="#f5f5f7">live signing checks</text><text x="36" y="298" font-size="20" fill="#86868b">14 of 14 on a real host</text></g>
    <g transform="translate(1130 310)"><rect width="360" height="340" rx="36" fill="url(#tile)" stroke="url(#rim)" stroke-width="1.5"/><text x="36" y="190" font-size="130" font-weight="700" letter-spacing="-5" fill="url(#g4)">0</text><text x="36" y="262" font-size="26" font-weight="600" fill="#f5f5f7">outbound connections</text><text x="36" y="298" font-size="20" fill="#86868b">from the sealed cell</text></g>
    <text x="800" y="740" font-size="22" fill="#86868b" text-anchor="middle">After the Keep to Merion rename · evidence class software-test · signer was a script, not a phone</text>
  </g>
