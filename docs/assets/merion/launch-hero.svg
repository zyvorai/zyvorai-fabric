<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
  <title id="t">Merion</title>
  <desc id="d">Your agent gets a real computer. You keep the keys. Three promises: a sealed cell, approvals signed on your phone, and nothing applied until you say so.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05060b"/><stop offset="1" stop-color="#0b0d18"/></linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7cc4ff"/><stop offset="0.55" stop-color="#a78bfa"/><stop offset="1" stop-color="#ff8fb1"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.11"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="90"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g filter="url(#blur)">
    <circle cx="330" cy="150" r="230" fill="#3b82f6" opacity="0.40"/>
    <circle cx="1290" cy="120" r="250" fill="#a855f7" opacity="0.36"/>
    <circle cx="800" cy="900" r="300" fill="#ec4899" opacity="0.22"/>
  </g>
  <g font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="800" y="150" font-size="22" font-weight="600" letter-spacing="9" fill="#9aa3b8">MERION</text>
    <text x="800" y="290" font-size="96" font-weight="700" letter-spacing="-3" fill="#f5f5f7">Your agent gets</text>
    <text x="800" y="395" font-size="96" font-weight="700" letter-spacing="-3" fill="#f5f5f7">a real computer.</text>
    <text x="800" y="505" font-size="96" font-weight="700" letter-spacing="-3" fill="url(#ink)">You keep the keys.</text>
    <text x="800" y="565" font-size="26" font-weight="400" fill="#9aa3b8">An open-source workstation for AI agents. Sealed, signed, and yours.</text>
  </g>
  <g font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <!-- card 1 -->
    <g transform="translate(160 650)">
      <rect width="400" height="170" rx="30" fill="url(#glass)" stroke="url(#rim)" stroke-width="1.5"/>
      <g transform="translate(36 24)" fill="none" stroke="#7cc4ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="16" width="40" height="30" rx="8"/><path d="M12 16v-6a10 10 0 0 1 20 0v6"/>
      </g>
      <text x="36" y="118" font-size="30" font-weight="600" fill="#f5f5f7">A sealed cell</text>
      <text x="36" y="148" font-size="19" fill="#9aa3b8">Zero outbound connections.</text>
    </g>
    <!-- card 2 -->
    <g transform="translate(600 650)">
      <rect width="400" height="170" rx="30" fill="url(#glass)" stroke="url(#rim)" stroke-width="1.5"/>
      <g transform="translate(36 20)" fill="none" stroke="#a78bfa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="8" y="2" width="30" height="52" rx="8"/><path d="M18 12h10M17 36l5 5 9-11"/>
      </g>
      <text x="36" y="118" font-size="30" font-weight="600" fill="#f5f5f7">Signed on your phone</text>
      <text x="36" y="148" font-size="19" fill="#9aa3b8">Forged or flipped? Refused.</text>
    </g>
    <!-- card 3 -->
    <g transform="translate(1040 650)">
      <rect width="400" height="170" rx="30" fill="url(#glass)" stroke="url(#rim)" stroke-width="1.5"/>
      <g transform="translate(36 24)" fill="none" stroke="#ff8fb1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="24" cy="26" r="21"/><path d="M14 27l8 8 14-17"/>
      </g>
      <text x="36" y="118" font-size="30" font-weight="600" fill="#f5f5f7">Nothing until you say</text>
      <text x="36" y="148" font-size="19" fill="#9aa3b8">The agent can't approve itself.</text>
    </g>
  </g>
</svg>
