<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
  <title id="t">Approvals only your phone can give</title>
  <desc id="d">A phone shows a waiting approval to apply one file change, with outbound network blocked. Beside it: unsigned, flipped and forged decisions are refused, and a valid signature goes through once.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbfbfd"/><stop offset="1" stop-color="#eceef5"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3b42"/><stop offset="0.5" stop-color="#16171b"/><stop offset="1" stop-color="#2c2d33"/></linearGradient>
    <linearGradient id="go" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b9bff"/><stop offset="1" stop-color="#0a6cf0"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8f1ff"/><stop offset="1" stop-color="#f3e9ff"/></linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%"><feDropShadow dx="0" dy="40" stdDeviation="40" flood-color="#1d2340" flood-opacity="0.28"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#1d2340" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="130" y="210" font-size="20" font-weight="600" letter-spacing="8" fill="#86868b">APPROVALS</text>
    <text x="130" y="310" font-size="78" font-weight="700" letter-spacing="-2.5" fill="#1d1d1f">Only your phone</text>
    <text x="130" y="396" font-size="78" font-weight="700" letter-spacing="-2.5" fill="#1d1d1f">can say yes.</text>
    <text x="130" y="460" font-size="25" fill="#6e6e73">Every decision is signed with a key that never leaves your device.</text>
    <g transform="translate(130 520)"><g filter="url(#soft)"><rect width="760" height="76" rx="22" fill="#ffffff"/></g><circle cx="44" cy="38" r="9" fill="#ff6a3d"/><text x="76" y="46" font-size="24" fill="#1d1d1f">No signature</text><text x="724" y="46" font-size="24" font-weight="600" text-anchor="end" fill="#ff6a3d">Refused · 403</text></g>
    <g transform="translate(130 608)"><g filter="url(#soft)"><rect width="760" height="76" rx="22" fill="#ffffff"/></g><circle cx="44" cy="38" r="9" fill="#ff6a3d"/><text x="76" y="46" font-size="24" fill="#1d1d1f">Decision flipped after signing</text><text x="724" y="46" font-size="24" font-weight="600" text-anchor="end" fill="#ff6a3d">Refused · 403</text></g>
    <g transform="translate(130 696)"><g filter="url(#soft)"><rect width="760" height="76" rx="22" fill="#ffffff"/></g><circle cx="44" cy="38" r="9" fill="#ff6a3d"/><text x="76" y="46" font-size="24" fill="#1d1d1f">Forged key</text><text x="724" y="46" font-size="24" font-weight="600" text-anchor="end" fill="#ff6a3d">Refused · 403</text></g>
    <g transform="translate(130 784)"><g filter="url(#soft)"><rect width="760" height="76" rx="22" fill="#ffffff"/></g><circle cx="44" cy="38" r="9" fill="#1fb76a"/><text x="76" y="46" font-size="24" fill="#1d1d1f">Your signature, once</text><text x="724" y="46" font-size="24" font-weight="600" text-anchor="end" fill="#1fb76a">Accepted · 200</text></g>
    <g transform="translate(1010 70)" filter="url(#shadow)">
      <rect width="390" height="780" rx="68" fill="url(#body)"/>
      <rect x="10" y="10" width="370" height="760" rx="58" fill="#0b0b0d"/>
      <rect x="18" y="18" width="354" height="744" rx="52" fill="url(#wall)"/>
      <rect x="135" y="34" width="120" height="34" rx="17" fill="#0b0b0d"/>
      <text x="195" y="128" font-size="17" font-weight="600" text-anchor="middle" letter-spacing="3" fill="#6e6e73">MERION</text>
      <rect x="40" y="158" width="310" height="428" rx="34" fill="#ffffff"/>
      <text x="68" y="212" font-size="25" font-weight="700" fill="#1d1d1f" letter-spacing="-0.4">Apply 1 file change?</text>
      <text x="68" y="244" font-size="17" fill="#6e6e73">from  echo hello &gt; a.txt</text>
      <rect x="68" y="272" width="254" height="72" rx="18" fill="#f2f6ff"/>
      <text x="86" y="303" font-size="15" font-weight="600" fill="#0a6cf0">ADDED</text>
      <text x="86" y="328" font-size="17" fill="#1d1d1f" font-family="ui-monospace, 'SF Mono', Menlo, monospace">/work/a.txt</text>
      <rect x="68" y="360" width="254" height="56" rx="18" fill="#effaf3"/>
      <circle cx="94" cy="388" r="8" fill="#1fb76a"/>
      <text x="112" y="394" font-size="17" fill="#1d1d1f">Outbound network blocked</text>
      <text x="68" y="452" font-size="15" fill="#86868b">Nothing has been applied yet.</text>
      <rect x="64" y="476" width="118" height="58" rx="29" fill="#f0f0f3"/>
      <text x="123" y="512" font-size="20" font-weight="600" text-anchor="middle" fill="#1d1d1f">Deny</text>
      <rect x="196" y="476" width="130" height="58" rx="29" fill="url(#go)"/>
      <text x="261" y="512" font-size="20" font-weight="600" text-anchor="middle" fill="#ffffff">Approve</text>
      <text x="195" y="560" font-size="13" text-anchor="middle" fill="#86868b">Signed with this phone's key</text>
      <rect x="135" y="738" width="120" height="6" rx="3" fill="#1d1d1f" opacity="0.8"/>
    </g>
  </g>
</svg>
