<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
  <title id="t">Measured on one lab host: cold cell runs at 1, 2 and 4 at a time</title>
  <desc id="d">Median run time 12.7, 15.9 and 21.1 seconds; throughput 4.7, 7.8 and 11.0 runs a minute; free host memory dropped 1.0, 2.8 and 4.5 GiB. One host, one tiny file, eight runs per level. Not a promise.</desc>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;fill:#1d1d1f}
    .h{font-size:16px;font-weight:650}
    .t{font-size:13px}
    .s{font-size:12px;fill:#6e6e73}
    .c{text-anchor:middle}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
  </style>
  <rect x="1" y="1" width="1198" height="518" rx="24" fill="#fff" stroke="#e5e5ea" stroke-width="2"/>

  <text class="h" x="40" y="60">Time for one run</text><text class="s" x="40" y="80">median seconds (worst of 8 as a tick)</text>
  <line x1="40" y1="390" x2="380" y2="390" stroke="#d2d2d7"/>
  <rect x="70" y="278.2" width="60" height="111.8" rx="8" fill="#0071e3" opacity="0.55"/>
  <text class="t c" x="100" y="308.2" style="font-weight:700;fill:#fff">12.7 s</text>
  <line x1="82" y1="262.4" x2="118" y2="262.4" stroke="#1d1d1f" stroke-width="2"/>
  <text class="t c" x="100" y="412">1</text>
  <rect x="170" y="250.1" width="60" height="139.9" rx="8" fill="#0071e3" opacity="0.75"/>
  <text class="t c" x="200" y="280.1" style="font-weight:700;fill:#fff">15.9 s</text>
  <line x1="182" y1="241.3" x2="218" y2="241.3" stroke="#1d1d1f" stroke-width="2"/>
  <text class="t c" x="200" y="412">2</text>
  <rect x="270" y="204.3" width="60" height="185.7" rx="8" fill="#0071e3" opacity="0.95"/>
  <text class="t c" x="300" y="234.3" style="font-weight:700;fill:#fff">21.1 s</text>
  <line x1="282" y1="178.8" x2="318" y2="178.8" stroke="#1d1d1f" stroke-width="2"/>
  <text class="t c" x="300" y="412">4</text>
  <text class="s c" x="210" y="434">runs at once</text>
  <text class="h" x="420" y="60">Throughput</text><text class="s" x="420" y="80">runs per minute</text>
  <line x1="420" y1="390" x2="760" y2="390" stroke="#d2d2d7"/>
  <rect x="450" y="303.8" width="60" height="86.2" rx="8" fill="#0071e3" opacity="0.55"/>
  <text class="t c" x="480" y="333.8" style="font-weight:700;fill:#fff">4.7</text>
  <text class="t c" x="480" y="412">1</text>
  <rect x="550" y="247.0" width="60" height="143.0" rx="8" fill="#0071e3" opacity="0.75"/>
  <text class="t c" x="580" y="277.0" style="font-weight:700;fill:#fff">7.8</text>
  <text class="t c" x="580" y="412">2</text>
  <rect x="650" y="188.3" width="60" height="201.7" rx="8" fill="#0071e3" opacity="0.95"/>
  <text class="t c" x="680" y="218.3" style="font-weight:700;fill:#fff">11.0</text>
  <text class="t c" x="680" y="412">4</text>
  <text class="s c" x="590" y="434">runs at once</text>
  <text class="h" x="800" y="60">Host memory used</text><text class="s" x="800" y="80">free memory drop, GiB</text>
  <line x1="800" y1="390" x2="1140" y2="390" stroke="#d2d2d7"/>
  <rect x="830" y="346.0" width="60" height="44.0" rx="8" fill="#0071e3" opacity="0.55"/>
  <text class="t c" x="860" y="376.0" style="font-weight:700;fill:#fff">1.0 GiB</text>
  <text class="t c" x="860" y="412">1</text>
  <rect x="930" y="266.8" width="60" height="123.2" rx="8" fill="#0071e3" opacity="0.75"/>
  <text class="t c" x="960" y="296.8" style="font-weight:700;fill:#fff">2.8 GiB</text>
  <text class="t c" x="960" y="412">2</text>
  <rect x="1030" y="192.0" width="60" height="198.0" rx="8" fill="#0071e3" opacity="0.95"/>
  <text class="t c" x="1060" y="222.0" style="font-weight:700;fill:#fff">4.5 GiB</text>
  <text class="t c" x="1060" y="412">4</text>
  <text class="s c" x="970" y="434">runs at once</text>
  <rect x="40" y="456" width="1120" height="48" rx="12" fill="#fffaeb" stroke="#f5d78f"/>
  <text class="s" x="58" y="477" style="fill:#5c4300">One lab host (12 vCPU, 31 GiB), template node22-agent (2 GiB per cell), csv-clean on a tiny file, 8 runs per level. Cold runs only:</text>
  <text class="s" x="58" y="494" style="fill:#5c4300">warm-pool and hibernate latency are not measured. A method and a data point, not a promise. Measure on your own hardware with scripts/merion-bench.sh.</text>
</svg>