[package]
name = "zyvor-fabricd-operator"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
[[bin]]
name = "zyvor-fabricd-operator"
path = "src/main.rs"

[dependencies]
kube = { version = "5.0", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.28", features = ["v1_32"] }
tokio = { version = "1.53", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
schemars = "1.2"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
http = "1"
reqwest = { version = "0.13", features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[dev-dependencies]
tower = "0.5"
http = "1"
http-body-util = "0.1"
bytes = "1"
wiremock = "0.6"
