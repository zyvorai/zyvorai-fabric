name: Keep chart

on:
  pull_request:
    paths:
      - 'charts/zyvor-keep/**'
      - 'agent-runtime/Dockerfile'
      - '.github/workflows/keep-chart.yml'
  push:
    branches: [main]
    paths:
      - 'charts/zyvor-keep/**'
      - 'agent-runtime/Dockerfile'
      - '.github/workflows/keep-chart.yml'

permissions:
  contents: read

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - name: Lint and validate
        run: |
          SIGNER=$(printf 'a%.0s' $(seq 1 64))
          helm lint charts/zyvor-keep --set "keep.trustedSigners={$SIGNER}"
          helm template k charts/zyvor-keep --set "keep.trustedSigners={$SIGNER}" > render.yaml
          kubeconform -strict -summary -kubernetes-version 1.30.0 render.yaml
      - name: Keep mode without a trusted signer must not render
        run: |
          if helm template k charts/zyvor-keep 2>err.txt; then echo "rendered without a signer"; exit 1; fi
          grep -q "trustedSigners" err.txt
          if helm template k charts/zyvor-keep --set "keep.trustedSigners={nothex}" 2>err.txt; then echo "accepted a bad signer"; exit 1; fi
          grep -q "64 hex" err.txt
      - name: Credential descriptors and secret volumes render and validate
        run: |
          SIGNER=$(printf 'a%.0s' $(seq 1 64))
          cat > values-creds.yaml <<EOF
          keep: {trustedSigners: ["$SIGNER"]}
          serviceAccount: {name: keep-runtime}
          credentials:
            descriptors:
              stripe:
                host: api.stripe.com
                header: authorization
                source: {kind: file, path: /run/secrets/stripe/key}
          runtime:
            extraVolumes:
              - {name: stripe, secret: {secretName: stripe-key, defaultMode: 256}}
            extraVolumeMounts:
              - {name: stripe, mountPath: /run/secrets/stripe, readOnly: true}
          EOF
          helm lint charts/zyvor-keep -f values-creds.yaml
          helm template k charts/zyvor-keep -f values-creds.yaml > render-creds.yaml
          kubeconform -strict -summary -kubernetes-version 1.30.0 render-creds.yaml
          grep -q 'ZYVOR_AGENT_CREDENTIALS_FILE' render-creds.yaml
          grep -q 'serviceAccountName: keep-runtime' render-creds.yaml
          grep -q 'mountPath: /run/secrets/stripe' render-creds.yaml
          grep -q 'checksum/credentials' render-creds.yaml
          # Without descriptors, none of it is rendered.
          helm template k charts/zyvor-keep --set "keep.trustedSigners={$SIGNER}" > render-none.yaml
          ! grep -q 'ZYVOR_AGENT_CREDENTIALS_FILE' render-none.yaml
      - name: The API token comes from a Secret, never a literal
        run: |
          SIGNER=$(printf 'a%.0s' $(seq 1 64))
          helm template k charts/zyvor-keep --set "keep.trustedSigners={$SIGNER}" | awk '/kind: DaemonSet/,0' > ds.yaml
          grep -A3 'name: ZYVOR_AGENT_API_TOKEN' ds.yaml | grep -q secretKeyRef
