name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev libclang-dev clang pkg-config libssl-dev

      - name: Check formatting
        run: cd backend && cargo fmt -- --check

      - name: Lint
        run: cd backend && cargo clippy -- -D warnings

      - name: Test
        run: cd backend && cargo test

      - name: Build
        run: cd backend && cargo build --release

  coverage-rust:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev libclang-dev clang pkg-config libssl-dev
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: cargo llvm-cov (informational)
        run: |
          cd backend
          cargo llvm-cov --workspace --lcov --output-path lcov.info || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rust-lcov
          path: backend/lcov.info
          if-no-files-found: ignore

  api-audit:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev libclang-dev clang pkg-config libssl-dev

      - name: UX API audit smoke test
        run: ./scripts/ci-api-audit.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: cd web && npm ci

      - name: Lint
        run: cd web && npm run lint

      - name: Typecheck
        run: cd web && npm run typecheck

      - name: Test
        run: cd web && npm test

      - name: Coverage (informational)
        continue-on-error: true
        run: cd web && npm run test:coverage

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: web-coverage
          path: web/coverage
          if-no-files-found: ignore

      - name: Build
        run: cd web && npm run build

      # axe-core on 20 console pages x light/dark x desktop/phone, plus visible focus (ux-plan step 7)
      - name: Accessibility gate
        run: |
          cd web
          npx puppeteer browsers install chrome
          CI=1 npm run a11y

  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the docs show "last updated" from git history

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: cd website && npm ci

      - name: Build
        run: cd website && npm run build

      # no sideways scroll, axe clean, Lighthouse accessibility and performance >= 95 (ux-plan step 8)
      - name: Site checks
        run: |
          cd website
          npx puppeteer browsers install chrome
          CI=1 npm run check

  # Explicit catch-up gate (FluxVM boundary contracts). Also covered by
  # `test` / `web` / Fabric E2E; this job surfaces failures with a clear name.
  catch-up:
    name: Catch-up coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpam0g-dev libclang-dev clang pkg-config libssl-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
          shared-key: catch-up

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: FluxVM stub smoke
        run: |
          python3 tests/fixtures/fluxvm-stub.py &
          echo $! > /tmp/fluxvm-stub.pid
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:7788/readyz >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl -sf http://127.0.0.1:7788/readyz | tee /tmp/readyz.json
          grep -q secure_containers /tmp/readyz.json
          curl -sf http://127.0.0.1:7788/v1/vms/11111111-1111-1111-1111-111111111111/network/status | tee /tmp/dp-status.json
          grep -q pod_ingress /tmp/dp-status.json
          curl -sf http://127.0.0.1:7788/v1/vms/11111111-1111-1111-1111-111111111111/network/stats | tee /tmp/dp-stats.json
          grep -q pod_policy /tmp/dp-stats.json
          curl -sf -X POST http://127.0.0.1:7788/v1/vms/11111111-1111-1111-1111-111111111111/qga/ping | grep -q '"ok"'
          kill "$(cat /tmp/fluxvm-stub.pid)" 2>/dev/null || true

      - name: Rust catch-up contracts
        run: |
          cd backend
          cargo test -p zyvor-fabric-fluxvm-client -p zyvor-fabric-fluxvm-driver -p migration -p datacenter --tests --lib
          cargo test -p zyvor-fabricd --lib agent_runtime::tests
          cargo test -p zyvor-fabricd --lib container_placement::tests
          cargo test -p zyvor-fabricd --lib heartbeat_persists
          cargo test -p zyvor-fabricd --lib heartbeat_falls_back

      - name: Web catch-up API paths
        run: |
          cd web
          npm ci
          npx vitest run src/api/__tests__/api-files.test.ts -t "containerGroups|agents|dataplane catch-up"

  docs-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Regenerate project stats
        run: ./scripts/generate-project-stats.sh
      - name: Fail if stats drifted
        run: git diff --exit-code -- docs/generated/project-stats.md

  proven-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Benchmark harness unit tests
        run: python3 -m unittest benchmarks.test_harness -v
      - name: Upgrade/rollback dry-run
        run: bash scripts/test-upgrade-rollback.sh
      - name: Chaos qualify (in-tree track)
        run: bash scripts/chaos-qualify.sh
