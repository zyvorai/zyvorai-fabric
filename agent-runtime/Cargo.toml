[package]
name = "zyvor-fabric-agent-runtime"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
description = "Durable TypeScript agent sessions backed by Zyvor FluxVM sandboxes"

# This component intentionally stays outside backend/Cargo.toml's legacy workspace.
# It can evolve independently without perturbing the main Fabric daemon lockfile.
[workspace]

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
axum = { version = "0.8", features = ["json", "http1", "tokio", "ws", "multipart"] }
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rcgen = { version = "0.13", features = ["x509-parser"] }
rustls = "0.23"
futures-core = "0.3"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.11"
time = "0.3"
tokio-rustls = "0.26"
tokio = { version = "1.53", features = ["full"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
uuid = { version = "1.26", features = ["v4", "serde"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
regex = "1"
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
hmac = "0.13"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1.53", features = ["test-util"] }
tempfile = "3.27.0"
