## Global
global:
  imageRegistry: ""
  imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

## The Keep runtime does not start FluxVM. It talks to the FluxVM on the same node, so install
## the zyvor-fabric chart (or run FluxVM some other way) on every node this runs on. Nodes need /dev/kvm.
runtime:
  image:
    repository: zyvor-fabric-agent-runtime
    pullPolicy: IfNotPresent
    tag: "local"
  ## Runs with hostNetwork, like the FluxVM daemonset, so cells can reach the egress broker and
  ## the runtime can reach FluxVM on 127.0.0.1.
  ## The API stays on loopback by default; reach it with `kubectl port-forward pod/<pod> 9096`.
  listen: "127.0.0.1:9096"
  ## The broker and CONNECT proxy cells call. They are bound on the node, so restrict them with
  ## the node firewall to the cells' network.
  egressListen: "0.0.0.0:18082"
  proxyListen: "0.0.0.0:18083"
  fluxvmUrl: "http://127.0.0.1:7788"
  ## Journal, sessions and agents live here. Keep it on local disk, not a shared volume.
  stateHostPath: /var/lib/zyvor-fabric-agent
  snapshotHostPath: /var/lib/fluxvm/agent-snapshots
  ## Any further ZYVOR_AGENT_* settings, as a list of {name, value}.
  extraEnv: []
  ## Extra volumes and mounts, as ordinary Kubernetes volume and volumeMount entries. Use them to mount
  ## the files a credential `source` reads: a Kubernetes Secret (set `defaultMode: 0400`, or the source
  ## sets `allow_loose_permissions`), a CSI Secrets Store volume, or a Vault Agent sink.
  extraVolumes: []
  extraVolumeMounts: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 1Gi

merion:
  ## Keep mode: policy and agent deployments must carry a valid Ed25519 signature, and the
  ## runtime refuses to start without trusted signers. Turn it off only for a lab.
  mode: true
  ## Hex Ed25519 public keys (64 characters each) that may sign policy. Required when merion.mode is true.
  ## Create one with `scripts/deploy-merion.sh`, or see docs/merion/sentinel/README.md. Never put a seed here.
  trustedSigners: []

## Credential descriptors, for ZYVOR_AGENT_CREDENTIALS_FILE: a map of credential name to descriptor. A
## descriptor names where a secret comes from and never holds one: an `env` variable, or a `source`
## (a mounted `file`, or `vault`). Rendered to a ConfigMap and mounted read-only. See docs/merion/vault/README.md.
## Example:
##   credentials:
##     descriptors:
##       github:
##         host: api.github.com
##         header: authorization
##         prefix: "Bearer "
##         source:
##           kind: vault
##           addr: https://vault.internal:8200
##           path: keep/github
##           field: token
##           auth: {method: kubernetes, role: keep}
credentials:
  descriptors: {}

## The pod's service account. Vault's Kubernetes login sends this account's token, so name one that is
## bound to a Vault role. The token is mounted at the standard path unless automountToken is false.
serviceAccount:
  name: ""
  automountToken: true

security:
  ## An existing Secret with the key `api-token` (and optionally `fluxvm-token`).
  existingSecret: ""
  ## Empty: a random token is generated on first install and reused on upgrades.
  apiToken: ""
  ## Bearer token for FluxVM's API, if FluxVM has auth turned on.
  fluxvmToken: ""

tolerations:
  - operator: Exists
nodeSelector: {}
