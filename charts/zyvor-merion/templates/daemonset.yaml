{{- include "zyvor-merion.validate" . }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "zyvor-merion.fullname" . }}
  labels:
    {{- include "zyvor-merion.labels" . | nindent 4 }}
    app.kubernetes.io/component: runtime
spec:
  selector:
    matchLabels:
      {{- include "zyvor-merion.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: runtime
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        {{- include "zyvor-merion.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: runtime
      {{- if .Values.credentials.descriptors }}
      annotations:
        # A changed descriptor restarts the runtime, which reads them once at startup.
        checksum/credentials: {{ toJson .Values.credentials.descriptors | sha256sum }}
      {{- end }}
    spec:
      {{- with .Values.serviceAccount.name }}
      serviceAccountName: {{ . }}
      {{- end }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: agent-runtime
        image: {{ include "zyvor-merion.image" . }}
        imagePullPolicy: {{ .Values.runtime.image.pullPolicy }}
        env:
        - name: ZYVOR_AGENT_LISTEN
          value: {{ .Values.runtime.listen | quote }}
        - name: ZYVOR_AGENT_EGRESS_LISTEN
          value: {{ .Values.runtime.egressListen | quote }}
        - name: ZYVOR_AGENT_PROXY_LISTEN
          value: {{ .Values.runtime.proxyListen | quote }}
        - name: ZYVOR_AGENT_FLUXVM_URL
          value: {{ .Values.runtime.fluxvmUrl | quote }}
        - name: ZYVOR_AGENT_STATE_DIR
          value: /var/lib/zyvor-fabric-agent
        - name: ZYVOR_AGENT_SNAPSHOT_DIR
          value: /var/lib/fluxvm/agent-snapshots
        - name: ZYVOR_AGENT_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "zyvor-merion.secretName" . }}
              key: api-token
        - name: ZYVOR_AGENT_FLUXVM_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ include "zyvor-merion.secretName" . }}
              key: fluxvm-token
              optional: true
        {{- if .Values.merion.mode }}
        - name: ZYVOR_AGENT_MERION_MODE
          value: "1"
        - name: ZYVOR_AGENT_POLICY_TRUSTED_SIGNERS
          value: {{ join "," .Values.merion.trustedSigners | quote }}
        {{- end }}
        {{- if .Values.credentials.descriptors }}
        - name: ZYVOR_AGENT_CREDENTIALS_FILE
          value: /etc/zyvor/credentials/credentials.json
        {{- end }}
        {{- with .Values.runtime.extraEnv }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: state
          mountPath: /var/lib/zyvor-fabric-agent
        - name: snapshots
          mountPath: /var/lib/fluxvm/agent-snapshots
        - name: tmp
          mountPath: /tmp
        {{- if .Values.credentials.descriptors }}
        - name: credentials
          mountPath: /etc/zyvor/credentials
          readOnly: true
        {{- end }}
        {{- with .Values.runtime.extraVolumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- /* The listen address may be loopback; hostNetwork makes it the node's loopback, which the kubelet probes reach. */}}
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ (split ":" .Values.runtime.listen)._1 | int }}
            host: {{ (split ":" .Values.runtime.listen)._0 | quote }}
          initialDelaySeconds: 10
          periodSeconds: 20
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: {{ (split ":" .Values.runtime.listen)._1 | int }}
            host: {{ (split ":" .Values.runtime.listen)._0 | quote }}
          initialDelaySeconds: 3
          periodSeconds: 10
        resources:
          {{- toYaml .Values.runtime.resources | nindent 10 }}
      volumes:
      - name: state
        hostPath:
          path: {{ .Values.runtime.stateHostPath }}
          type: DirectoryOrCreate
      - name: snapshots
        hostPath:
          path: {{ .Values.runtime.snapshotHostPath }}
          type: DirectoryOrCreate
      - name: tmp
        emptyDir: {}
      {{- if .Values.credentials.descriptors }}
      - name: credentials
        configMap:
          name: {{ include "zyvor-merion.fullname" . }}-credentials
      {{- end }}
      {{- with .Values.runtime.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
