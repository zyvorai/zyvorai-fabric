# Advisory/license/ban policy for cargo-deny (v2 schema).
# cargo-deny 0.20+: advisory severity keys removed; use ignore + yanked.

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "warn"
# Baseline exceptions for first proven-infra land (issue #6 / Dependabot).
# Remove IDs as crates are upgraded.
ignore = [
    "RUSTSEC-2024-0436",
    "RUSTSEC-2024-0370",
    "RUSTSEC-2024-0437",
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    "RUSTSEC-2025-0134",
    "RUSTSEC-2023-0040",
    "RUSTSEC-2025-0040",
    # unsafe-libyaml is unmaintained (no known exploit); it comes in through serde_yaml in cloud-init and fabricctl. Drop this when they move to another YAML crate.
    "RUSTSEC-2024-0449",
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "CC0-1.0",
    "MPL-2.0",
    "0BSD",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-git = []
